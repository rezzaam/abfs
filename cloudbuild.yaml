# Builds the abfs-client .deb (see build.sh) and uploads it to an Artifact Registry APT
# repository. Run from a checkout of this branch:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REPOSITORY=abfs-apt-canary,_ARTIFACT_BUCKET=<bucket> .
steps:
  - id: build
    name: golang:1.26.6
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq make gcc python3 >/dev/null
        VERSION=${_VERSION} OUT_DIR=/workspace/out bash build.sh
        dpkg-deb -I /workspace/out/abfs-client_${_VERSION}_amd64.deb
  - id: upload
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [[ "${_UPLOAD}" == "true" ]]; then
          gcloud artifacts apt upload ${_REPOSITORY} --location=${_LOCATION} \
            --source=/workspace/out/abfs-client_${_VERSION}_amd64.deb
        else
          echo "upload skipped (_UPLOAD=${_UPLOAD})"
        fi
substitutions:
  _VERSION: 0.1.23-lars.c975ebd.v3
  _REPOSITORY: abfs-apt
  _LOCATION: europe-west4
  _UPLOAD: "true"
  _ARTIFACT_BUCKET: abfs-argolis-rezzaam-casfs-cache
artifacts:
  objects:
    location: gs://${_ARTIFACT_BUCKET}/abfs-client/${_VERSION}/
    paths: [/workspace/out/*]
options:
  machineType: E2_HIGHCPU_8
  logging: GCS_ONLY
timeout: 2400s
